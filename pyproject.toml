[project]
name = "fastapi-course"
version = "0.1.0"
description = "This project is used specifically for learning FastAPI - Course"
readme = "README.md"
authors = [
    { name = "neerajhamada", email = "neerajh231@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.163.1",
    "sqlmodel>=0.0.50",
]

[project.scripts]
fastapi-course = "fastapi_course:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
